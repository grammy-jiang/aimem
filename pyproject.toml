[project]
name = "aimem"
version = "0.1.0"
description = "AI Agent Memory Manager — git-based persistent memory for local AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Grammy Jiang" }]
keywords = ["ai", "memory", "agent", "cli", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
search = [
    "rank-bm25>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tox>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "isort>=5.13",
    "black>=24.0",
]

[project.scripts]
aimem = "aimem.cli.app:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimem"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tox>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "isort>=5.13",
    "black>=24.0",
]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-xvs"
